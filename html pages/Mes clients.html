<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application LUMIERE CANAL+ / MES CLIENTS</title>
    
    <link href="../CSS/styles.css" rel="stylesheet">
</head>
<body>
    <div class =global_page >
        <header>
            <h1> APPLICATION DE GESTION DU FLUX CANAL+ </h1>
            <h2> ETS LUMIERE</h2>
        </header>
        <nav>
                <button class="btn-option"> Mes clients</button>
                <button class="btn-option">Mes ventes</button>
                <button class="btn-option">Mes recrutements</button>
        </nav>
        <main>
            <h3> LISTE DES CLIENTS</h3>
               <!-- bouton sur lequel l'utilisateur va cliquer-->
                <label for ="toogle-form" class="btn-toogle"> Afficher le formulaire</label>
                <!-- case à cocher invisible  qui sert d'interrupteur -->
                <input type="checkbox" id="toogle-form" class="form-trigger">
               
            <div class="infos-clt">
                <button  id="btn-save">+ Enregistrer un nouveau client</button>
                <button id="btn-update">* Modifier les infos d'un client</button>
            </div><br>
            <form  id="formulaireClient" class="formulaireCaché" hidden>
                <p>Veuillez entrer les informations client</p>
                <div>
                    <label for="numero">Numéro de décodeur:</label><br>
                    <input type="number" name="decodeur" id="numDecodeur"   placeholder="ex: 23800..." required>
                </div> <br><br>
                <div>
                    <label for="numero">Numéro de téléphone:</label><br>
                    <input type="number" name="telephone" id="numTelephone"required>
                </div> <br><br>
                <div>
                    <label for="nom">Nom du client:</label><br>
                    <input type="text" name="nom" id="nomClient" required>
                </div> <br><br>
                <div>
                    <label for="text">Prénom du client:</label><br>
                    <input type="text" name="prenom" id="prenomClient"/>
                </div> <br><br>
                <div>
                    <label for="date">Date de début</label><br>
                    <input type="date" name="datedebut" id="dateDeDebut" required>
                </div><br><br>
                <div>
                    <label for="date">Date de fin</label><br>
                    <input type="date" name="datefin" id="dateDeFin" required>
                </div><br><br>
                <div>
                    <label for="formule">Dernière formule:</label><br>
                    <select id="formule" name="formuleReabo">
                        <option value="">--Choisissez une formule --</option>
                        <option value="access">Access-5000</option>
                        <option value="Evasion">Evasion-10500</option>
                        <option value="access">Access+-15000</option>
                        <option value="toutcanal">Tout canal-28000</option>
                </div><br><br>
                <div>
                    <label for="nombreJours">Nombre de jours restants</label>
                    <input type="number" name="nombreJours" id="nbreJoursRestants" required>
                </div><br><br>
                 <div>
                    <label for="message">Message d'alerte</label>
                    <textarea id="alert-msg" name="message" rows="5" cols="20" placeholder="Quelle est la situation actuelle du client"></textarea>
                </div><br><br>

                <input type="submit" id="btn-enregistrer">
            </form >
            <table>
                <thead>
                <tr>
                   
                    <th>Decodeur</th>
                    <th>Telephone</th>
                    <th>Nom </th>
                    <th>Prenom </th>
                    <th>Date_de_debut</th>
                    <th>Date_de_fin</th>
                    <th>Nombre_de_jours_restants</th>
                    <th>Formule</th>
                    <th>Message_alerte</th>
                </tr>
                </thead>
                <tbody id="body-table">
                
                </tbody>
             </table>
            <br>
            
        </main>
        <footer>
        <hr>
        <p>Coorporated by <a href="">LUMIERE</a></p>
        </footer>
    </div>
    
<script src = "../SCRIPTS JS/scriptJs.js" defer></script>
</body>
</html>
